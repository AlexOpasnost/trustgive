<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Paper, not the verified green. This paints the browser chrome on
         mobile, and the green is reserved for saying a regulator confirmed a
         record — it should not also be the colour of the address bar. -->
    <meta name="theme-color" content="#F5F1E8" />
    <title>TrustGive — Verified charity discovery</title>
    <!-- No counts here. This file is static, so any number written into it goes
         stale the moment the catalogue changes — it said "540+ verified
         charities across 27 countries" for weeks after the July audit left 370
         across 10. The Worker rewrites this tag with live figures from
         /api/stats/; this text is the fallback for when the API is unreachable,
         so it must stay true at any catalogue size. -->
    <meta name="description" content="Charity discovery that links every claim to the regulator's own file — IRS 990, UK Charity Commission, ACNC — not a star rating you can't audit. 0% platform fee, no donation pass-through. If we can't open an organisation's filing, we don't list it." />
    <meta property="og:title" content="TrustGive — Verified charity discovery" />
    <meta property="og:description" content="0% platform fee. We never see your money. Every 'verified' claim links to the original IRS 990, Charity Commission filing, or Минюст registration." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Source Serif was requested at weight 400 only, while every page title,
         the wordmark and the bucket-card headlines ask for 700. The browser was
         synthesising those by smearing the 400 outlines — faux bold, on the
         typeface that carries the whole editorial voice. `400..700` is the
         variable font's real weight axis and costs one file either way. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400..700&family=Geist+Mono:wght@500&display=swap&subset=latin,cyrillic" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
