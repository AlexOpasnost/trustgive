<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Cream paper background -->
  <rect width="32" height="32" fill="#F5F1E8"/>
  <!--
    The wordmark's initial, cut as a Source Serif "T". Drawn as paths so the
    favicon never depends on a system font.

    It replaces a dagger (†). That glyph was picked as the academic citation
    mark, which is what this project is about, but at icon size it reads as a
    cross — wrong for a secular worldwide catalogue — and it was drawn in the
    forest green that now means "a regulator confirmed this record" and nothing
    else. A favicon makes no such claim, so it is ink on paper like the rest of
    the site.
  -->
  <g fill="#181612">
    <!-- Top bar -->
    <rect x="5" y="6" width="22" height="3.5"/>
    <!-- Bracket serifs turning down at each end of the bar -->
    <rect x="5" y="9.5" width="2.5" height="2"/>
    <rect x="24.5" y="9.5" width="2.5" height="2"/>
    <!-- Stem -->
    <rect x="14" y="9.5" width="4" height="14.5"/>
    <!-- Foot serif -->
    <rect x="10.5" y="24" width="11" height="3"/>
  </g>
</svg>
