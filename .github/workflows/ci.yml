name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    name: Workflows parse and their shell is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Nothing else in this repository checks the files that run everything
      # else in this repository, and on 2026-08-10 that cost a scheduled run:
      # a warning message wrapped onto a line starting at column 1, which ends
      # a `run: |` block scalar. GitHub could not parse monitor.yml, the run
      # produced no jobs at all, and `gh workflow run` reported the workflow had
      # no dispatch trigger — none of which names the actual problem.
      #
      # Two checks, because they catch different things and the second is the
      # one a YAML parser cannot see.
      - name: Every workflow is valid YAML
        run: |
          set -euo pipefail
          python3 -c "
          import sys, glob, yaml
          bad = 0
          for path in sorted(glob.glob('.github/workflows/*.yml')):
              try:
                  yaml.safe_load(open(path, encoding='utf-8'))
                  print('ok   ', path)
              except Exception as exc:
                  print('FAIL ', path, exc)
                  bad += 1
          sys.exit(1 if bad else 0)
          "

      # Quoted, because an unquoted colon in a step name is itself a YAML
      # mapping-value error — which this job caught on its own first run.
      - name: "Every run: block is valid shell"
        run: |
          set -euo pipefail
          # `bash -n` parses without executing. It catches the class YAML is
          # blind to — an unbalanced quote, a broken case block, a here-doc that
          # never closes — which would otherwise only surface at 02:00 on the
          # schedule, in a job nobody is watching.
          python3 - <<'PY'
          import glob, subprocess, sys, yaml

          bad = 0
          for path in sorted(glob.glob(".github/workflows/*.yml")):
              spec = yaml.safe_load(open(path, encoding="utf-8"))
              for job_name, job in (spec.get("jobs") or {}).items():
                  for step in job.get("steps") or []:
                      body = step.get("run")
                      if not body:
                          continue
                      label = f"{path}::{job_name}::{step.get('name', '(unnamed)')}"
                      result = subprocess.run(
                          ["bash", "-n", "-"], input=body, text=True, capture_output=True
                      )
                      if result.returncode:
                          print("FAIL ", label)
                          print("      ", result.stderr.strip())
                          bad += 1
                      else:
                          print("ok   ", label)
          sys.exit(1 if bad else 0)
          PY

  backend-lint:
    name: Backend lint + typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      # ruff comes from requirements-dev.txt (pinned) rather than being
      # installed unpinned here, so a new ruff release can't turn the build red
      # on its own.
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  backend-test:
    name: Backend pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trustgive_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/trustgive_test
      # pytest runs under trustgive.settings.test, which reads TEST_DATABASE_URL
      # (not DATABASE_URL) and defaults to the docker-compose sidecar on :5433.
      # Without this, pytest would have looked for a Postgres that doesn't exist
      # on the runner.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/trustgive_test
      DJANGO_SECRET_KEY: ci-only-not-secret
      DJANGO_DEBUG: 'True'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      # requirements-dev.txt carries pytest itself. Without it this job ran
      # `pytest` and exited 127.
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # `makemigrations` (without --check) used to run here and generate any
      # missing migration on the fly, so model/migration drift could never fail
      # the build — it was silently repaired on every run and never committed.
      # Two migrations were in fact missing. --check turns drift into a failure.
      - name: Fail if a model change has no migration
        run: python manage.py makemigrations --check --dry-run
      - name: Migrate from scratch
        run: python manage.py migrate
      - name: Validate OpenAPI schema round-trip
        run: python manage.py spectacular --validate --fail-on-warn
      - name: Run pytest
        run: pytest --tb=short -q

  frontend-lint:
    name: Frontend lint + typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

      # The Worker was not typechecked anywhere. `tsconfig.app.json` includes
      # only `src`, and wrangler bundles with esbuild, which strips types
      # without reading them — so worker/index.ts, the code that serves every
      # page on the site, reached production unchecked. It has its own
      # tsconfig; this just runs it.
      - name: Typecheck the Cloudflare Worker
        working-directory: .
        run: ./frontend/web/node_modules/.bin/tsc --noEmit -p worker/tsconfig.json

  frontend-test:
    name: Frontend vitest + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/web/dist
          retention-days: 7
