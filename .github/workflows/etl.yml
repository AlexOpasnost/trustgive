name: Nightly data refresh

# Keeps the catalogue's factual layer current without manual work:
#   1. refresh_us_filings — re-reads ProPublica for every US charity, stores the
#      real fiscal-period end (never a synthesised date), pulls newer financials
#      and recomputes is_stale.
#   2. audit_source_links — re-checks every source document and demotes any
#      charity whose regulator link has rotted, so a "Verified" badge can never
#      outlive its evidence. Since the catalogue is verified-only, a demotion
#      also removes the charity from public view — which is the intended
#      behaviour: no evidence, no listing.
#
# Both commands are idempotent and safe to re-run.
#
# History — this job silently failed every night until 2026-07-28. Four separate
# defects, each sufficient on its own:
#   * it called `ingest_propublica`, a command that does not exist;
#   * `secrets.RAILWAY_TOKEN` was never created, so auth failed in ~15s;
#   * it targeted `--service backend`, but the services are `trustgive` and
#     `Postgres`;
#   * it installed Node only, then ran `python manage.py` with no Python, no
#     dependencies and the wrong working directory.
# The lesson worth keeping: a scheduled job that fails is indistinguishable from
# one that never runs. This workflow now reports failure loudly (see the final
# step) rather than rotting quietly.

on:
  schedule:
    # 02:00 UTC daily
    - cron: '0 2 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  refresh:
    name: Refresh filings + re-audit source links
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Install Railway CLI
        run: npm install -g @railway/cli@latest

      # `railway run` executes locally with the project's environment variables
      # injected (DATABASE_URL, SECRET_KEY, …) — it does not run on Railway's
      # machines, which is why the dependencies above are required here.
      - name: Refresh US filings from ProPublica
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway run --service trustgive python manage.py refresh_us_filings

      - name: Re-audit source links
        # Runs even if the refresh step fails — link rot is the higher-severity
        # check: it is what removes an unsupported "Verified" badge.
        if: always()
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway run --service trustgive python manage.py audit_source_links
