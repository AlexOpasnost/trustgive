name: Nightly data refresh

# Keeps the catalogue's factual layer current without manual work:
#   1. refresh_us_filings — re-reads ProPublica for every US charity, stores the
#      real fiscal-period end (never a synthesised date), pulls newer financials,
#      recomputes is_stale, and stamps updated_at so the public
#      "Re-checked by TrustGive {date}" line stays truthful.
#   2. audit_source_links — re-checks every source document and demotes any
#      charity whose regulator link has rotted, so a "Verified" badge can never
#      outlive its evidence.
#
# Both commands are idempotent and safe to re-run.
#
# NOTE (2026-07-27): this workflow previously called `ingest_propublica --since=24h`,
# a command that does not exist in apps/charities/management/commands — so the
# nightly job had been failing without ever refreshing anything. Replaced with the
# commands that are actually implemented.

on:
  schedule:
    # 02:00 UTC daily
    - cron: '0 2 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  refresh:
    name: Refresh filings + re-audit source links
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Railway CLI
        run: npm install -g @railway/cli@latest

      - name: Refresh US filings from ProPublica
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway run --service backend python manage.py refresh_us_filings

      - name: Re-audit source links
        # Runs even if the refresh step fails — link rot is the higher-severity
        # check: it is what removes an unsupported "Verified" badge.
        if: always()
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway run --service backend python manage.py audit_source_links
